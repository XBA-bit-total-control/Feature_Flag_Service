[project]
name = "feature-flag-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vladislav Huc", email = "vladislavhucisvili@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
feature-flag-service = "feature_flag_service:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
