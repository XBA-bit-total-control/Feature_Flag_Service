apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feature-flags
spec:
  ingressClassName: nginx
  rules:
    - host: feature-flags.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port: {number: 8000}
